changelog:
  exclude:
    labels:
      - 'skip-changelog'
  categories:
    - title: 🏕 Features
      labels:
        - 'enhancement'
    - title: 🛠 Fixes
      labels:
        - 'bug'
    - title: 📚 Docs
      labels:
        - 'documentation'
    - title: 👒 Dependencies
      labels:
        - 'dependencies'
    - title: 🧹 Other changes
      labels:
        - '*'
