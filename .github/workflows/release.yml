name: Desktop - Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.9.6). Leave empty to use git tag/branch ref'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install rpmbuild (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build with Gradle
        working-directory: FloconDesktop
        run: ./gradlew packageDistributionForCurrentOS packageUberJarForCurrentOS
        env:
          PROJECT_VERSION_NAME: ${{ inputs.version || github.ref_name }}

      - name: Prepare and rename artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/dmg/*.dmg dist/Flocon-macos-arm64.dmg
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-macos-arm64.jar
          elif [ "${{ matrix.platform }}" = "macos-x64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/dmg/*.dmg dist/Flocon-macos-x64.dmg
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-macos-x64.jar
          elif [ "${{ matrix.platform }}" = "linux-x64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/deb/*.deb dist/
            mv FloconDesktop/composeApp/build/compose/binaries/main/rpm/*.rpm dist/
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-linux-x64.jar
          elif [ "${{ matrix.platform }}" = "windows-x64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/msi/*.msi dist/
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-windows-x64.jar
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          retention-days: 3

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ inputs.draft || false }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Check prerequisites
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, skipping the Homebrew tap update."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::'$VERSION' is not a release version (X.Y.Z), skipping the Homebrew tap update."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout cask template
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/homebrew
          path: flocon

      - name: Checkout Homebrew tap
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: openflocon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download macOS artifacts
        if: steps.check.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-macos-*
          path: macos-assets
          merge-multiple: true

      - name: Generate cask
        if: steps.check.outputs.run == 'true'
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          SHA_ARM64=$(sha256sum macos-assets/Flocon-macos-arm64.dmg | cut -d' ' -f1)
          SHA_X64=$(sha256sum macos-assets/Flocon-macos-x64.dmg | cut -d' ' -f1)
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$VERSION/" \
              -e "s/__SHA256_ARM64__/$SHA_ARM64/" \
              -e "s/__SHA256_X64__/$SHA_X64/" \
              flocon/.github/homebrew/flocon.rb.template > tap/Casks/flocon.rb
          cat tap/Casks/flocon.rb

      - name: Push to tap
        if: steps.check.outputs.run == 'true'
        working-directory: tap
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flocon.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "flocon $VERSION"
          git push
