name: Desktop - Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.9.6). Leave empty to use git tag/branch ref'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install rpmbuild (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build with Gradle
        working-directory: FloconDesktop
        run: ./gradlew packageDistributionForCurrentOS packageUberJarForCurrentOS
        env:
          PROJECT_VERSION_NAME: ${{ inputs.version || github.ref_name }}

      - name: Prepare and rename artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/dmg/*.dmg dist/Flocon-macos-arm64.dmg
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-macos-arm64.jar
          elif [ "${{ matrix.platform }}" = "macos-x64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/dmg/*.dmg dist/Flocon-macos-x64.dmg
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-macos-x64.jar
          elif [ "${{ matrix.platform }}" = "linux-x64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/deb/*.deb dist/
            mv FloconDesktop/composeApp/build/compose/binaries/main/rpm/*.rpm dist/
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-linux-x64.jar
          elif [ "${{ matrix.platform }}" = "windows-x64" ]; then
            mv FloconDesktop/composeApp/build/compose/binaries/main/msi/*.msi dist/
            mv FloconDesktop/composeApp/build/compose/jars/*.jar dist/Flocon-windows-x64.jar
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          retention-days: 3

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ inputs.draft || false }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
